name: Percy Visual Testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  percy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx percy snapshot .snapshots.yml
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}